<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        form{
            border: 2px solid black;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
        }
        label{
            display: block;
        }

        input{
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 15px;
            align-items: center ;
        }

        button{
            padding: 8px 20px;
            cursor: pointer;
            margin: 5px;
        }
        
        .buttons{
            text-align: center;
        }

        

    </style>
</head>
<body>
    <h1>Login form</h1>
    <form action="">
        <label for="Email">
            Email:
            <input 
            type="text" 
            name="Email" 
            placeholder="Entet your  Email ID"
            id = "user"
            />
        </label>
        <label for="Password">
            Password:
            <input 
            type="password"
            name = "Password"
            placeholder="Enter the Correct Password"
            id =""
            />
        </label>
        <div>
            <button type="submit">Login</button>
            <button type="reset">Reset</button>
        </div>
      
    </form>
</body>
</html>
