<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>

    <style>
        table {
            width: 500px;
            border-collapse: collapse;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 2px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <table>
        <caption>Student Information</caption>

        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Birju Kumar</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Manish Kumar</td>
                <td>21</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
